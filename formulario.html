<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Información</title>

    <style>
        body {
            background-color: AntiqueWhite;
        }

        label {
            font-family: Arial, sans-serif;
            font-size: 18px;
        }

        h1 {
            font-family: Arial, sans-serif;
            font-size: 25px;
            color: brown;
        }

        fieldset {
            padding: 10px;
        }

        input:disabled {
            background-color: lightgray;
        }

    </style>
</head>

<body>

    <h1>Formulario de Información</h1>

    <form action="formulario.php" method="POST">

        <fieldset>
            <legend>Sus Datos</legend>

            <p>
                <label for="nombre">Nombre y apellidos:</label>
                <input type="text" id="nombre"
                       name="nombre" maxlength="50">
            </p>

            <p>
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena"
                       name="contrasena" maxlength="8">
            </p>

            <p>
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario"
                       name="usuario" value="anónimo" disabled>
            </p>

            <p>
                <label for="nivel">Nivel:</label>
            </p>

            <p>
                <input type="radio" name="nivel"
                       value="profesional">
                <label>Profesional</label>
            </p>

            <p>
                <input type="radio" name="nivel"
                       value="avanzado" checked>
                <label>Avanzado</label>
            </p>

            <p>
                <input type="radio" name="nivel"
                       value="principiante">
                <label>Principiante</label>
            </p>

        </fieldset>

        <br>

        <p>
            <label for="nacionalidad">Nacionalidad:</label>

            <select id="nacionalidad" name="nacionalidad">
                <option selected>España</option>
                <option>Rumanía</option>
                <option>Francia</option>
                <option>Italia</option>
            </select>
        </p>

        <p>
            <label for="descripcion">Descripción:</label><br>
            <textarea id="descripcion"
                      name="descripcion"
                      rows="4" cols="30"></textarea>
        </p>

        <p>
            <input type="checkbox" name="ofertas" checked>
            <label>
                Deseo recibir información sobre novedades y ofertas
            </label>
        </p>

        <p>
            <input type="checkbox" name="condiciones">
            <label>
                Declaro haber leído y aceptar las condiciones generales
                del programa y la normativa sobre protección de datos
            </label>
        </p>

        <p>
            <label for="foto">Adjuntar foto:</label>
            <input type="file" id="foto" name="foto">
        </p>

        <input type="submit" value="Enviar">
        <input type="reset" value="Borrar datos">

    </form>

</body>
</html>
